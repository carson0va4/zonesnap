name: Idea or feature request
description: Something ZoneSnap could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or annoyance, rather than the solution, helps most, e.g. "When I alt-tab out of my game, Discord ends up behind it".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like ZoneSnap to do?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Monitor resolution(s), and the games or apps involved
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Other apps that do this well, screenshots, sketches
